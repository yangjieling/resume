<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding Agent 编排工作台 · 容器视图</title>
  <desc id="desc">C4 Container：用户入口、控制面 API、工作流/执行器/技能/SQLite，以及可插拔 Provider。</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #fafafa; }
      .lane { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; }
      .lane-tint-a { fill: #f4f4f5; }
      .lane-tint-b { fill: #fafafa; }
      .lane-label {
        fill: #71717a;
        font: 600 11px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
        letter-spacing: 0.06em;
      }
      .title {
        fill: #18181b;
        font: 700 20px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
      }
      .subtitle {
        fill: #71717a;
        font: 400 12px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
      }
      .box {
        fill: #ffffff;
        stroke: #18181b;
        stroke-width: 1.25;
      }
      .box-muted {
        fill: #ffffff;
        stroke: #a1a1aa;
        stroke-width: 1.15;
      }
      .box-label {
        fill: #18181b;
        font: 500 13px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
        text-anchor: middle;
      }
      .box-sub {
        fill: #71717a;
        font: 400 10px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
        text-anchor: middle;
      }
      .edge {
        fill: none;
        stroke: #18181b;
        stroke-width: 1.35;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .edge-muted {
        fill: none;
        stroke: #a1a1aa;
        stroke-width: 1.2;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .edge-sync {
        fill: none;
        stroke: #52525b;
        stroke-width: 1.45;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .arrow { fill: #18181b; }
      .arrow-muted { fill: #a1a1aa; }
      .arrow-sync { fill: #52525b; }
      .sync-label {
        fill: #71717a;
        font: 500 10px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
      }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="arrow"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="arrow-muted"/>
    </marker>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="arrow-sync"/>
    </marker>
  </defs>

  <rect width="960" height="740" class="bg"/>

  <text x="48" y="36" class="title">AI Coding Agent 编排工作台 · 容器视图</text>
  <text x="48" y="56" class="subtitle">C4 Container · 控制面与执行面分离</text>

  <rect x="40" y="72" width="880" height="78" rx="10" class="lane lane-tint-a"/>
  <text x="56" y="92" class="lane-label">USER</text>

  <rect x="40" y="166" width="880" height="90" rx="10" class="lane lane-tint-b"/>
  <text x="56" y="186" class="lane-label">ENTRY</text>

  <rect x="40" y="276" width="880" height="200" rx="10" class="lane lane-tint-a"/>
  <text x="56" y="296" class="lane-label">CORE</text>

  <rect x="40" y="496" width="880" height="100" rx="10" class="lane lane-tint-b"/>
  <text x="56" y="516" class="lane-label">PROVIDERS</text>

  <rect x="340" y="98" width="280" height="36" rx="8" class="box"/>
  <text x="480" y="121" class="box-label">研发工程师</text>

  <rect x="160" y="196" width="200" height="40" rx="8" class="box"/>
  <text x="260" y="222" class="box-label">CLI</text>

  <rect x="600" y="196" width="200" height="40" rx="8" class="box"/>
  <text x="700" y="222" class="box-label">本地面板 Web UI</text>

  <rect x="70" y="320" width="180" height="48" rx="8" class="box"/>
  <text x="160" y="342" class="box-label">控制面 API</text>
  <text x="160" y="358" class="box-sub">任务状态机</text>

  <rect x="290" y="320" width="180" height="48" rx="8" class="box"/>
  <text x="380" y="342" class="box-label">工作流引擎</text>
  <text x="380" y="358" class="box-sub">YAML Workflow</text>

  <rect x="510" y="320" width="180" height="48" rx="8" class="box"/>
  <text x="600" y="342" class="box-label">执行器</text>
  <text x="600" y="358" class="box-sub">子进程 · 续跑</text>

  <rect x="180" y="400" width="200" height="48" rx="8" class="box"/>
  <text x="280" y="422" class="box-label">技能注册表</text>
  <text x="280" y="438" class="box-sub">SKILL.md 包</text>

  <rect x="460" y="400" width="200" height="48" rx="8" class="box"/>
  <text x="560" y="422" class="box-label">SQLite</text>
  <text x="560" y="438" class="box-sub">任务 · 设置</text>

  <rect x="70" y="528" width="220" height="44" rx="8" class="box-muted"/>
  <text x="180" y="556" class="box-label">Agent Provider</text>

  <rect x="370" y="528" width="220" height="44" rx="8" class="box-muted"/>
  <text x="480" y="556" class="box-label">Issue Provider</text>

  <rect x="670" y="528" width="220" height="44" rx="8" class="box-muted"/>
  <text x="780" y="556" class="box-label">Notify Provider</text>

  <!-- user → entry bus -->
  <path class="edge" d="M480,134 V156"/>
  <path class="edge" d="M260,156 H700"/>
  <path class="edge" marker-end="url(#arrow)" d="M260,156 V196"/>
  <path class="edge" marker-end="url(#arrow)" d="M700,156 V196"/>

  <!-- entry → API -->
  <path class="edge" d="M260,236 V268"/>
  <path class="edge" d="M700,236 V268"/>
  <path class="edge" d="M160,268 H700"/>
  <path class="edge" marker-end="url(#arrow)" d="M160,268 V320"/>

  <!-- API → WF -->
  <path class="edge" marker-end="url(#arrow)" d="M250,344 H290"/>

  <!-- API bus down → Exec / Skills / DB -->
  <path class="edge" d="M160,368 V384"/>
  <path class="edge" d="M160,384 H600"/>
  <path class="edge" marker-end="url(#arrow)" d="M600,384 V368"/>
  <path class="edge" marker-end="url(#arrow)" d="M280,384 V400"/>
  <path class="edge" marker-end="url(#arrow)" d="M560,384 V400"/>

  <!-- WF → Exec -->
  <path class="edge-muted" marker-end="url(#arrow-muted)" d="M470,344 H510"/>

  <!-- Exec → Agent Provider -->
  <path class="edge" marker-end="url(#arrow)" d="M600,368 V492 H180 V528"/>

  <!-- API → Issue / Notify (left spine) -->
  <path class="edge" d="M70,344 H28 V550"/>
  <path class="edge" marker-end="url(#arrow)" d="M28,550 H370"/>
  <path class="edge" marker-end="url(#arrow)" d="M28,550 H670"/>

  <!-- Skills → Exec 注入 -->
  <path class="edge-sync" marker-end="url(#arrow-sync)" d="M380,424 H600 V368"/>
  <text x="470" y="412" class="sync-label">注入</text>

  <text x="48" y="640" class="subtitle">工程师经入口总线进入 CLI / 面板；二者汇入控制面 API，再扇出到工作流、执行器、技能与 SQLite。</text>
  <text x="48" y="668" class="subtitle">执行器对接 Agent Provider；API 经左侧竖干连 Issue / Notify；技能以 sync 边「注入」执行器。</text>
  <text x="48" y="696" class="subtitle">控制面与执行面分离 · 正交 H/V · CORE 两行排布 · 960 宽。</text>

</svg>
