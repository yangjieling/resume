<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="title desc">
  <title id="title">AI Coding Agent 编排工作台 · 部署架构</title>
  <desc id="desc">本地优先五层部署：客户端、控制面、工作区、本机 Agent CLI、外部协同；正交 spine + bus，外部分发沿右侧绕行。</desc>

  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #fafafa; }
      .lane { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; }
      .lane-tint-a { fill: #f4f4f5; }
      .lane-tint-b { fill: #fafafa; }
      .lane-label {
        fill: #71717a;
        font: 600 11px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
        letter-spacing: 0.06em;
      }
      .title {
        fill: #18181b;
        font: 700 20px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
      }
      .subtitle {
        fill: #71717a;
        font: 400 12px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
      }
      .box {
        fill: #ffffff;
        stroke: #18181b;
        stroke-width: 1.25;
      }
      .box-muted {
        fill: #ffffff;
        stroke: #a1a1aa;
        stroke-width: 1.15;
      }
      .box-label {
        fill: #18181b;
        font: 500 13px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
        text-anchor: middle;
      }
      .box-sub {
        fill: #71717a;
        font: 400 10px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
        text-anchor: middle;
      }
      .edge {
        fill: none;
        stroke: #18181b;
        stroke-width: 1.35;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .edge-muted {
        fill: none;
        stroke: #a1a1aa;
        stroke-width: 1.2;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .edge-sync {
        fill: none;
        stroke: #52525b;
        stroke-width: 1.45;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
      .arrow { fill: #18181b; }
      .arrow-muted { fill: #a1a1aa; }
      .arrow-sync { fill: #52525b; }
      .sync-label {
        fill: #71717a;
        font: 500 10px "IBM Plex Sans", "Noto Sans SC", "PingFang SC", sans-serif;
      }
    ]]></style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="arrow"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="arrow-muted"/>
    </marker>
    <marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" class="arrow-sync"/>
    </marker>
  </defs>

  <rect width="960" height="700" class="bg"/>

  <text x="48" y="36" class="title">AI Coding Agent 编排工作台 · 部署架构</text>
  <text x="48" y="56" class="subtitle">hb-cli / agent-desk · 本地优先 · 正交分层（spine + bus）</text>

  <!-- Lanes -->
  <rect x="40" y="72" width="880" height="78" rx="10" class="lane lane-tint-a"/>
  <text x="56" y="92" class="lane-label">CLIENT</text>

  <rect x="40" y="166" width="880" height="78" rx="10" class="lane lane-tint-b"/>
  <text x="56" y="186" class="lane-label">CONTROL</text>

  <rect x="40" y="260" width="880" height="100" rx="10" class="lane lane-tint-a"/>
  <text x="56" y="280" class="lane-label">WORKSPACE</text>

  <rect x="40" y="380" width="880" height="90" rx="10" class="lane lane-tint-b"/>
  <text x="56" y="400" class="lane-label">AGENTS</text>

  <rect x="40" y="490" width="880" height="110" rx="10" class="lane lane-tint-a"/>
  <text x="56" y="510" class="lane-label">EXTERNAL</text>

  <!-- CLIENT boxes: centers 280 / 680, bottoms 138 -->
  <rect x="160" y="94" width="240" height="44" rx="8" class="box"/>
  <text x="280" y="112" class="box-label">本地面板</text>
  <text x="280" y="128" class="box-sub">localhost Web UI</text>

  <rect x="560" y="94" width="240" height="44" rx="8" class="box"/>
  <text x="680" y="112" class="box-label">hb-cli / agent-desk CLI</text>
  <text x="680" y="128" class="box-sub">安装 · 升级 · 任务入口</text>

  <!-- CONTROL: center 480, top 186, bottom 234, right 640 -->
  <rect x="320" y="186" width="320" height="48" rx="8" class="box"/>
  <text x="480" y="206" class="box-label">本地控制面</text>
  <text x="480" y="222" class="box-sub">本机 HTTP · 任务状态机</text>

  <!-- WORKSPACE: centers 180 / 480 / 780, tops 292, bottoms 340 -->
  <rect x="80" y="292" width="200" height="48" rx="8" class="box"/>
  <text x="180" y="312" class="box-label">Agent 执行器</text>
  <text x="180" y="328" class="box-sub">子进程</text>

  <rect x="380" y="292" width="200" height="48" rx="8" class="box"/>
  <text x="480" y="312" class="box-label">技能与流程目录</text>
  <text x="480" y="328" class="box-sub">系统模板 + 个人</text>

  <rect x="680" y="292" width="200" height="48" rx="8" class="box"/>
  <text x="780" y="312" class="box-label">SQLite</text>
  <text x="780" y="328" class="box-sub">用户数据目录</text>

  <!-- AGENTS: centers 160 / 360 / 560 / 760, tops 412 -->
  <rect x="80" y="412" width="160" height="36" rx="8" class="box"/>
  <text x="160" y="435" class="box-label">JoyCode</text>

  <rect x="280" y="412" width="160" height="36" rx="8" class="box"/>
  <text x="360" y="435" class="box-label">Claude Code</text>

  <rect x="480" y="412" width="160" height="36" rx="8" class="box"/>
  <text x="560" y="435" class="box-label">Codex</text>

  <rect x="680" y="412" width="160" height="36" rx="8" class="box"/>
  <text x="760" y="435" class="box-label">Cursor Agent</text>

  <!-- EXTERNAL muted -->
  <rect x="60" y="530" width="180" height="48" rx="8" class="box-muted"/>
  <text x="150" y="550" class="box-label">Artifactory</text>
  <text x="150" y="566" class="box-sub">安装升级</text>

  <rect x="270" y="530" width="160" height="48" rx="8" class="box-muted"/>
  <text x="350" y="550" class="box-label">缺陷平台</text>
  <text x="350" y="566" class="box-sub">拉取 / 回写</text>

  <rect x="460" y="530" width="160" height="48" rx="8" class="box-muted"/>
  <text x="540" y="550" class="box-label">飞书 / 钉钉</text>
  <text x="540" y="566" class="box-sub">卡点 · 深链回控</text>

  <rect x="660" y="530" width="200" height="48" rx="8" class="box-muted"/>
  <text x="760" y="550" class="box-label">GitHub agent-desk</text>
  <text x="760" y="566" class="box-sub">Skill 种子同步</text>

  <!-- CLIENT → bus → CONTROL (hits panel/CLI bottoms @280/680, control top @480) -->
  <path class="edge" d="M280,138 V158"/>
  <path class="edge" d="M680,138 V158"/>
  <path class="edge" d="M280,158 H680"/>
  <path class="edge" marker-end="url(#arrow)" d="M480,158 V186"/>

  <!-- CONTROL → WORKSPACE bus → three boxes -->
  <path class="edge" d="M480,234 V280"/>
  <path class="edge" d="M180,280 H780"/>
  <path class="edge" marker-end="url(#arrow)" d="M180,280 V292"/>
  <path class="edge" marker-end="url(#arrow)" d="M480,280 V292"/>
  <path class="edge" marker-end="url(#arrow)" d="M780,280 V292"/>

  <!-- Executor → AGENTS bus → four agent CLIs -->
  <path class="edge" d="M180,340 V368"/>
  <path class="edge" d="M160,368 H760"/>
  <path class="edge" marker-end="url(#arrow)" d="M160,368 V412"/>
  <path class="edge" marker-end="url(#arrow)" d="M360,368 V412"/>
  <path class="edge" marker-end="url(#arrow)" d="M560,368 V412"/>
  <path class="edge" marker-end="url(#arrow)" d="M760,368 V412"/>

  <!-- Right spine EXTERNAL wiring (edge-sync / muted), avoid crossing runtime boxes -->
  <!-- Artifactory → bottom skirt → spine → CLI right edge -->
  <path class="edge-sync" marker-end="url(#arrow-sync)" d="M150,578 V600 H900 V116 H800"/>

  <!-- CONTROL right → spine (shared vertical with Artifactory path) -->
  <path class="edge-sync" d="M640,210 H900"/>

  <!-- CONTROL ↔ 缺陷平台 via bottom bus into Issue bottom -->
  <path class="edge-sync" marker-start="url(#arrow-sync)" marker-end="url(#arrow-sync)" d="M350,578 V600 H900"/>

  <!-- CONTROL → 飞书/钉钉 (deep-link back noted in caption) -->
  <path class="edge-sync" marker-end="url(#arrow-sync)" d="M900,600 H540 V578"/>

  <!-- 技能目录 ↔ GitHub：独立中右竖廊 (x=630)，避免与 SQLite / Agent / 右侧 spine 混淆 -->
  <path class="edge-muted" marker-start="url(#arrow-muted)" marker-end="url(#arrow-muted)" d="M480,340 V360 H630 V520 H760 V530"/>
  <text x="640" y="444" class="sync-label">Skill 同步</text>
  <text x="640" y="458" class="sync-label">技能目录 ↔ GitHub</text>

  <text x="48" y="640" class="sync-label">请求链路</text>
  <text x="120" y="640" class="sync-label">面板 / CLI → 控制面 → 执行器 / 技能 / SQLite → 本机 Agent CLI</text>
  <text x="48" y="660" class="sync-label">外联</text>
  <text x="88" y="660" class="sync-label">Artifactory→CLI 安装升级；控制面↔缺陷平台；控制面→飞书/钉钉（深链回控）；Skill 同步走中右竖廊，避免与 SQLite/Agent 混淆</text>
  <text x="48" y="682" class="subtitle">外部分发与协同沿右侧正交绕行，避免穿越本地运行时框</text>
</svg>
